# ByteTrack settings for person tracking (Ultralytics YOLO track())
# Goal: one stable ID per person — survive box resize (walk toward camera) and brief occlusion
#
# IMPORTANT: match_thresh is a max cost (cost = 1 - IoU), NOT an IoU minimum.
#   match_thresh UP   → allow smaller overlap (helps size change; risks ID swaps in crowds)
#   match_thresh DOWN → stricter matching (fewer swaps when people cross)
#
# Other knobs:
#   new_track_thresh  UP slightly → harder to spawn a spurious new ID (keep <= PERSON_CONF)
#   track_buffer      how long to keep a lost track before freeing the ID

tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.4
# Stricter than 0.88 — crowded walkways swap IDs when this is too high
match_thresh: 0.80
track_buffer: 90
fuse_score: True
